# Отдача SPA (React Router, BrowserRouter — см. apps/web/src/main.tsx):
# при обновлении страницы на любом внутреннем маршруте (например,
# /sites/abc123) nginx по умолчанию искал бы файл apps/web/dist/sites/abc123
# и отдавал 404. try_files с фоллбеком на index.html отдаёт SPA-шелл,
# а маршрутизацию дальше делает React Router на клиенте.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статику с хэшем в имени (Vite добавляет хэш при сборке) можно
    # кэшировать надолго — при изменении содержимого меняется и имя файла.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
